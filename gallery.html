<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/png" href="assets/images/favicon.png">
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:type" content="article" />
    <meta property="og:title" content="Album ảnh cưới - Hằng 💕 Đoán" />
    <meta property="og:description" content="Album ảnh cưới Minh Đoán & Thuý Hằng" />
    <meta property="og:site_name" content="Hằng 💕 Đoán" />
    <title>Album ảnh cưới - Hằng 💕 Đoán</title>
    <link href="assets/css/themify-icons.css" rel="stylesheet">
    <link href="assets/css/font-awesome.min.css" rel="stylesheet">
    <link href="assets/css/flaticon.css" rel="stylesheet">
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/animate.css" rel="stylesheet">
    <link href="assets/sass/style.css" rel="stylesheet">
    <link href="assets/css/wedding-custom.css" rel="stylesheet">
</head>

<body>

    <!-- start page-wrapper -->
    <div class="page-wrapper">
        <!-- start preloader -->
        <div class="preloader">
            <div class="vertical-centered-box">
                <div class="content">
                    <div class="loader-circle"></div>
                    <div class="loader-line-mask">
                        <div class="loader-line"></div>
                    </div>
                    <img src="assets/images/preloader.svg" alt="">
                </div>
            </div>
        </div>
        <!-- end preloader -->
        <!-- Start header -->
        <header>
            <div class="wpo-site-header wpo-header-style-3">
                <nav class="navigation navbar navbar-expand-lg navbar-light">
                    <div class="container-fluid">
                        <div class="row align-items-center">
                            <div class="col-md-5 col-5 d-lg-none d-block">
                                <div class="mobail-menu">
                                    <button type="button" class="navbar-toggler open-btn">
                                        <span class="sr-only">Toggle navigation</span>
                                        <span class="icon-bar first-angle"></span>
                                        <span class="icon-bar middle-angle"></span>
                                        <span class="icon-bar last-angle"></span>
                                    </button>
                                </div>
                            </div>
                            <div class="col-lg-2 col-md-6 col-6 d-lg-block d-none">

                            </div>
                            <div class="col-md-7 col-7 d-lg-none dl-block">
                                <div class="navbar-header">
                                    <a class="navbar-brand" href="index.html"><img src="assets/images/logo.png" alt="Hằng Đoán Wedding"></a>
                                </div>
                            </div>
                            <div class="col-lg-8 col-md-1 col-1">
                                <div id="navbar" class="collapse navbar-collapse navigation-holder">
                                    <button class="menu-close"><i class="ti-close"></i></button>
                                    <ul class="nav navbar-nav mb-2 mb-lg-0">
                                        <li><a href="index.html">Trang chủ</a></li>
                                        <li><a href="index.html#event">Event</a></li>
                                        <li><a href="index.html#rsvp">Xác nhận</a></li>
                                        <li><a href="index.html#wishes">Lời chúc</a></li>
                                    </ul>
                                </div><!-- end of nav-collapse -->
                            </div>
                        </div>
                    </div><!-- end of container -->
                </nav>
            </div>
        </header>
        <!-- end of header -->

        <!-- start album -->
        <section class="wpo-album-section section-padding">
            <div class="container">
                <div class="wpo-section-title">
                    <h4>Sweet Memories</h4>
                    <h2>Album ảnh cưới</h2>
                    <p class="gallery-quote">Được ai đó yêu sâu sắc sẽ mang lại cho bạn sức mạnh,
                        trong khi yêu ai đó sâu sắc sẽ cho bạn dũng khí.</p>
                    <p class="album-count"><span id="album-total">0</span> tấm ảnh &mdash; bấm vào ảnh để xem lớn</p>
                </div>

                <!-- Lưới ảnh do wedding-custom.js dựng từ WEDDING_ALBUM trong wedding-config.js -->
                <div class="album-grid" id="album-grid"></div>

                <div class="album-back text-center">
                    <a class="theme-btn" href="index.html">Về trang chủ</a>
                </div>
            </div>
        </section>
        <!-- end album -->
    </div>
    <!-- end of page-wrapper -->

    <!-- start khung xem ảnh phóng to -->
    <div class="album-viewer" id="album-viewer" role="dialog" aria-modal="true" aria-label="Xem ảnh cưới" hidden>
        <div class="album-viewer-overlay" data-album="close"></div>
        <button type="button" class="album-viewer-close" data-album="close" aria-label="Đóng">&times;</button>
        <button type="button" class="album-nav album-prev" data-album="prev" aria-label="Ảnh trước">&#10094;</button>
        <button type="button" class="album-nav album-next" data-album="next" aria-label="Ảnh sau">&#10095;</button>
        <figure class="album-viewer-figure">
            <img id="album-viewer-img" alt="">
            <figcaption id="album-counter"></figcaption>
        </figure>
    </div>
    <!-- end khung xem ảnh phóng to -->

    <!-- All JavaScript files
    ================================================== -->
    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/modernizr.custom.js"></script>
    <script src="assets/js/jquery.dlmenu.js"></script>
    <script src="assets/js/jquery-plugin-collection.js"></script>
    <script src="assets/js/script.js"></script>
    <!-- Cấu hình đám cưới (danh sách ảnh, link maps, mừng cưới...) -->
    <script src="assets/js/wedding-config.js"></script>
    <script src="assets/js/wedding-custom.js"></script>
</body>

</html>
